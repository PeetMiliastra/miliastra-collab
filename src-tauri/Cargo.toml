[package]
name = "miliastra-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "miliastra_collab"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
miliastra-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
sha2.workspace = true
sha1 = "0.10"
chrono.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
notify = "8"
url = "2"
urlencoding = "2"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# Also wipe AES key schedules from memory, not just request buffers.
aes = { version = "0.8", features = ["zeroize"] }
zeroize = "1"
hmac = "0.12"
webbrowser = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_UI_Shell"] }
[dev-dependencies]
axum = "0.8"
